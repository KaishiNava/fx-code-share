<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1"
    >

    <meta
        name="description"
        content="FX Project Code Share — Koleksi source code, plugin, tools dan project."
    >

    <title>FX Project — Code Share</title>

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap"
        rel="stylesheet"
    >

    <style>
        :root {
            --bg: #050505;
            --panel: #0c0c0c;
            --panel-2: #111111;
            --border: rgba(255,255,255,.09);
            --border-hover: rgba(255,255,255,.18);
            --text: #f5f5f5;
            --muted: #8d8d8d;
            --soft: #151515;
            --white: #ffffff;
            --danger: #ff4d4d;
            --green: #45d483;
            --radius: 20px;
        }

        * {
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            margin: 0;
            background:
                radial-gradient(
                    circle at 50% -10%,
                    rgba(255,255,255,.08),
                    transparent 32%
                ),
                var(--bg);
            color: var(--text);
            font-family: Inter, sans-serif;
            min-height: 100vh;
        }

        button,
        input,
        textarea,
        select {
            font: inherit;
        }

        button {
            cursor: pointer;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        ::selection {
            background: white;
            color: black;
        }

        .topbar {
            position: sticky;
            top: 0;
            z-index: 50;
            height: 70px;
            display: flex;
            align-items: center;
            border-bottom: 1px solid var(--border);
            background: rgba(5,5,5,.78);
            backdrop-filter: blur(22px);
        }

        .topbar-inner {
            width: min(1180px, calc(100% - 32px));
            margin: auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            font-weight: 800;
            letter-spacing: -.04em;
        }

        .brand-mark {
            width: 38px;
            height: 38px;
            border-radius: 12px;
            display: grid;
            place-items: center;
            color: black;
            background: white;
            font-size: 14px;
            font-weight: 900;
        }

        .brand span {
            font-size: 16px;
        }

        .brand small {
            display: block;
            color: var(--muted);
            font-size: 10px;
            font-weight: 500;
            letter-spacing: .04em;
            margin-top: 2px;
        }

        .admin-link {
            border: 1px solid var(--border);
            background: rgba(255,255,255,.035);
            border-radius: 12px;
            padding: 9px 13px;
            color: #ddd;
            font-size: 13px;
            transition: .2s;
        }

        .admin-link:hover {
            border-color: var(--border-hover);
            background: rgba(255,255,255,.07);
        }

        .hero {
            width: min(1180px, calc(100% - 32px));
            margin: auto;
            padding: 82px 0 40px;
        }

        .eyebrow {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 7px 11px;
            border: 1px solid var(--border);
            border-radius: 999px;
            color: #cfcfcf;
            background: rgba(255,255,255,.025);
            font-size: 11px;
            font-weight: 600;
            letter-spacing: .06em;
            text-transform: uppercase;
        }

        .dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--green);
            box-shadow: 0 0 12px rgba(69,212,131,.5);
        }

        h1 {
            margin: 22px 0 14px;
            max-width: 780px;
            font-size: clamp(42px, 8vw, 82px);
            line-height: .94;
            letter-spacing: -.075em;
        }

        .hero p {
            max-width: 650px;
            margin: 0;
            color: var(--muted);
            line-height: 1.7;
            font-size: 15px;
        }

        .toolbar {
            width: min(1180px, calc(100% - 32px));
            margin: 10px auto 30px;
            display: grid;
            grid-template-columns: 1fr 180px;
            gap: 10px;
        }

        .search,
        .filter {
            height: 50px;
            border: 1px solid var(--border);
            outline: none;
            background: rgba(255,255,255,.035);
            color: var(--text);
            border-radius: 14px;
            padding: 0 15px;
            transition: .2s;
        }

        .search:focus,
        .filter:focus {
            border-color: rgba(255,255,255,.28);
            background: rgba(255,255,255,.055);
        }

        .filter option {
            background: #111;
        }

        .content {
            width: min(1180px, calc(100% - 32px));
            margin: auto;
            padding-bottom: 70px;
        }

        .section-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 15px;
        }

        .section-title {
            font-size: 13px;
            font-weight: 700;
            color: #ddd;
        }

        .count {
            color: var(--muted);
            font-size: 12px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 13px;
        }

        .card {
            position: relative;
            overflow: hidden;
            min-height: 205px;
            padding: 19px;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            background:
                linear-gradient(
                    145deg,
                    rgba(255,255,255,.045),
                    rgba(255,255,255,.015)
                );
            transition:
                transform .2s,
                border-color .2s,
                background .2s;
        }

        .card:hover {
            transform: translateY(-3px);
            border-color: var(--border-hover);
            background:
                linear-gradient(
                    145deg,
                    rgba(255,255,255,.07),
                    rgba(255,255,255,.025)
                );
        }

        .card-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            margin-bottom: 22px;
        }

        .lang {
            padding: 6px 9px;
            border-radius: 8px;
            background: #171717;
            border: 1px solid var(--border);
            font-family: "JetBrains Mono", monospace;
            font-size: 10px;
            color: #ddd;
        }

        .size {
            color: #666;
            font-size: 10px;
        }

        .card h2 {
            margin: 0 0 9px;
            font-size: 18px;
            letter-spacing: -.035em;
            line-height: 1.2;
        }

        .card p {
            margin: 0;
            min-height: 42px;
            color: var(--muted);
            font-size: 12px;
            line-height: 1.6;
        }

        .card-bottom {
            position: absolute;
            bottom: 17px;
            left: 19px;
            right: 19px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
        }

        .filename {
            min-width: 0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            font-family: "JetBrains Mono", monospace;
            color: #777;
            font-size: 10px;
        }

        .open-btn {
            flex: 0 0 auto;
            border: 1px solid var(--border);
            background: white;
            color: black;
            border-radius: 10px;
            padding: 8px 11px;
            font-size: 11px;
            font-weight: 700;
        }

        .empty,
        .loading {
            grid-column: 1 / -1;
            min-height: 240px;
            display: grid;
            place-items: center;
            text-align: center;
            border: 1px dashed var(--border);
            border-radius: var(--radius);
            color: var(--muted);
        }

        .modal {
            position: fixed;
            inset: 0;
            z-index: 100;
            display: none;
            background: rgba(0,0,0,.76);
            backdrop-filter: blur(14px);
        }

        .modal.active {
            display: flex;
        }

        .viewer {
            width: min(1200px, calc(100% - 20px));
            height: min(88vh, 850px);
            margin: auto;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            border: 1px solid var(--border-hover);
            border-radius: 20px;
            background: #090909;
            box-shadow: 0 30px 100px rgba(0,0,0,.7);
        }

        .viewer-head {
            min-height: 66px;
            padding: 11px 13px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
            border-bottom: 1px solid var(--border);
        }

        .viewer-info {
            min-width: 0;
        }

        .viewer-title {
            margin: 0;
            font-size: 15px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .viewer-meta {
            margin-top: 4px;
            color: #666;
            font-size: 10px;
            font-family: "JetBrains Mono", monospace;
        }

        .viewer-actions {
            display: flex;
            gap: 6px;
        }

        .action {
            height: 35px;
            padding: 0 11px;
            border: 1px solid var(--border);
            background: #111;
            color: #ddd;
            border-radius: 9px;
            font-size: 11px;
        }

        .action.primary {
            background: white;
            color: black;
        }

        .code-wrap {
            position: relative;
            flex: 1;
            min-height: 0;
            overflow: auto;
            background: #060606;
        }

        pre {
            margin: 0;
            padding: 22px;
            min-width: max-content;
            color: #d7d7d7;
            font-family: "JetBrains Mono", monospace;
            font-size: 12px;
            line-height: 1.75;
            tab-size: 4;
            white-space: pre;
        }

        .toast {
            position: fixed;
            left: 50%;
            bottom: 22px;
            z-index: 200;
            transform: translate(-50%, 20px);
            opacity: 0;
            pointer-events: none;
            padding: 11px 15px;
            border: 1px solid var(--border-hover);
            border-radius: 12px;
            background: #111;
            color: #eee;
            box-shadow: 0 15px 40px rgba(0,0,0,.5);
            font-size: 12px;
            transition: .25s;
        }

        .toast.show {
            transform: translate(-50%, 0);
            opacity: 1;
        }

        @media (max-width: 900px) {
            .grid {
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }
        }

        @media (max-width: 650px) {
            .topbar {
                height: 62px;
            }

            .topbar-inner,
            .hero,
            .toolbar,
            .content {
                width: min(100% - 22px, 1180px);
            }

            .hero {
                padding: 55px 0 28px;
            }

            h1 {
                font-size: 48px;
            }

            .toolbar {
                grid-template-columns: 1fr;
            }

            .grid {
                grid-template-columns: 1fr;
            }

            .viewer {
                width: calc(100% - 10px);
                height: 94vh;
                border-radius: 15px;
            }

            .viewer-actions .optional {
                display: none;
            }

            pre {
                padding: 15px;
                font-size: 11px;
            }
        }
    </style>
</head>

<body>

<header class="topbar">
    <div class="topbar-inner">

        <a href="/" class="brand">
            <div class="brand-mark">FX</div>

            <div>
                <span>FX Project</span>
                <small>CODE SHARE</small>
            </div>
        </a>

        <a href="/admin" class="admin-link">
            Admin
        </a>

    </div>
</header>

<main>

    <section class="hero">

        <div class="eyebrow">
            <span class="dot"></span>
            Public Code Library
        </div>

        <h1>
            Build.<br>
            Share.<br>
            Reuse.
        </h1>

        <p>
            Koleksi source code, plugin, tools, bot,
            scraper, utilities, dan project dari
            FX Project. Buka source langsung dan
            copy dalam satu klik.
        </p>

    </section>

    <section class="toolbar">

        <input
            id="search"
            class="search"
            type="search"
            placeholder="Cari project, file, bahasa..."
            autocomplete="off"
        >

        <select
            id="filter"
            class="filter"
        >
            <option value="all">
                Semua bahasa
            </option>
        </select>

    </section>

    <section class="content">

        <div class="section-head">
            <div class="section-title">
                SHARED CODE
            </div>

            <div
                id="count"
                class="count"
            >
                Loading...
            </div>
        </div>

        <div
            id="grid"
            class="grid"
        >
            <div class="loading">
                Memuat source code...
            </div>
        </div>

    </section>

</main>

<div
    id="modal"
    class="modal"
>

    <div class="viewer">

        <div class="viewer-head">

            <div class="viewer-info">

                <h2
                    id="viewerTitle"
                    class="viewer-title"
                >
                    -
                </h2>

                <div
                    id="viewerMeta"
                    class="viewer-meta"
                >
                    -
                </div>

            </div>

            <div class="viewer-actions">

                <button
                    id="copyBtn"
                    class="action primary"
                >
                    Copy
                </button>

                <button
                    id="downloadBtn"
                    class="action optional"
                >
                    Download
                </button>

                <button
                    id="rawBtn"
                    class="action optional"
                >
                    RAW
                </button>

                <button
                    id="closeBtn"
                    class="action"
                >
                    Close
                </button>

            </div>

        </div>

        <div class="code-wrap">
            <pre id="code"></pre>
        </div>

    </div>

</div>

<div
    id="toast"
    class="toast"
></div>

<script>
'use strict';

const state = {
    posts: [],
    current: null
};

const grid =
    document.getElementById('grid');

const search =
    document.getElementById('search');

const filter =
    document.getElementById('filter');

const count =
    document.getElementById('count');

const modal =
    document.getElementById('modal');

const viewerTitle =
    document.getElementById('viewerTitle');

const viewerMeta =
    document.getElementById('viewerMeta');

const code =
    document.getElementById('code');

const toast =
    document.getElementById('toast');

function escapeHtml(value) {
    return String(value)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
}

function formatSize(bytes) {
    if (!bytes) return '0 B';

    if (bytes < 1024) {
        return `${bytes} B`;
    }

    if (bytes < 1024 * 1024) {
        return `${(bytes / 1024).toFixed(1)} KB`;
    }

    return `${(bytes / 1024 / 1024).toFixed(2)} MB`;
}

function showToast(message) {
    toast.textContent = message;
    toast.classList.add('show');

    clearTimeout(
        showToast.timer
    );

    showToast.timer = setTimeout(() => {
        toast.classList.remove('show');
    }, 2300);
}

function renderFilters() {
    const languages = [
        ...new Set(
            state.posts
                .map(post => post.language)
                .filter(Boolean)
        )
    ].sort();

    filter.innerHTML = `
        <option value="all">
            Semua bahasa
        </option>

        ${languages.map(language => `
            <option value="${escapeHtml(language)}">
                ${escapeHtml(language)}
            </option>
        `).join('')}
    `;
}

function render() {
    const keyword =
        search.value
            .trim()
            .toLowerCase();

    const selected =
        filter.value;

    const filtered =
        state.posts.filter(post => {

            const searchable = [
                post.title,
                post.description,
                post.filename,
                post.language
            ]
                .join(' ')
                .toLowerCase();

            const matchSearch =
                !keyword ||
                searchable.includes(keyword);

            const matchFilter =
                selected === 'all' ||
                post.language === selected;

            return matchSearch &&
                matchFilter;
        });

    count.textContent =
        `${filtered.length} item`;

    if (!filtered.length) {
        grid.innerHTML = `
            <div class="empty">
                Tidak ada source yang cocok.
            </div>
        `;

        return;
    }

    grid.innerHTML =
        filtered.map(post => `
            <article class="card">

                <div class="card-top">

                    <span class="lang">
                        ${escapeHtml(
                            post.language || 'Text'
                        )}
                    </span>

                    <span class="size">
                        ${formatSize(post.size)}
                    </span>

                </div>

                <h2>
                    ${escapeHtml(post.title)}
                </h2>

                <p>
                    ${escapeHtml(
                        post.description ||
                        'Tidak ada deskripsi.'
                    )}
                </p>

                <div class="card-bottom">

                    <span class="filename">
                        ${escapeHtml(post.filename)}
                    </span>

                    <button
                        class="open-btn"
                        data-open="${escapeHtml(post.id)}"
                    >
                        Open
                    </button>

                </div>

            </article>
        `).join('');
}

async function loadPosts() {
    try {
        const response =
            await fetch(
                '/api?action=list'
            );

        const data =
            await response.json();

        if (!response.ok || !data.ok) {
            throw new Error(
                data.error ||
                'Gagal memuat data.'
            );
        }

        state.posts =
            Array.isArray(data.posts)
                ? data.posts
                : [];

        renderFilters();
        render();

        openFromUrl();

    } catch (error) {
        grid.innerHTML = `
            <div class="empty">
                Gagal memuat source.<br>
                <small>
                    ${escapeHtml(error.message)}
                </small>
            </div>
        `;

        count.textContent = 'Error';
    }
}

async function openPost(id) {
    try {
        modal.classList.add('active');

        viewerTitle.textContent =
            'Loading...';

        viewerMeta.textContent =
            'Mengambil source...';

        code.textContent = '';

        const response =
            await fetch(
                `/api?action=get&id=${encodeURIComponent(id)}`
            );

        const data =
            await response.json();

        if (!response.ok || !data.ok) {
            throw new Error(
                data.error ||
                'Source tidak ditemukan.'
            );
        }

        state.current = data;

        viewerTitle.textContent =
            data.post.title;

        viewerMeta.textContent =
            `${data.post.filename} • ${data.post.language} • ${formatSize(data.post.size)}`;

        code.textContent =
            data.code;

        history.replaceState(
            null,
            '',
            `/share/${encodeURIComponent(id)}`
        );

    } catch (error) {
        modal.classList.remove('active');
        showToast(error.message);
    }
}

function closeViewer() {
    modal.classList.remove('active');
    state.current = null;

    if (
        location.pathname.startsWith('/share/')
    ) {
        history.replaceState(
            null,
            '',
            '/'
        );
    }
}

async function copyCode() {
    if (!state.current) return;

    try {
        await navigator.clipboard.writeText(
            state.current.code
        );

        showToast(
            'Code berhasil dicopy.'
        );
    } catch {
        const area =
            document.createElement('textarea');

        area.value =
            state.current.code;

        document.body.appendChild(area);

        area.select();

        document.execCommand('copy');

        area.remove();

        showToast(
            'Code berhasil dicopy.'
        );
    }
}

function downloadCode() {
    if (!state.current) return;

    const blob =
        new Blob(
            [state.current.code],
            {
                type: 'text/plain;charset=utf-8'
            }
        );

    const url =
        URL.createObjectURL(blob);

    const a =
        document.createElement('a');

    a.href = url;

    a.download =
        state.current.post.filename ||
        'code.txt';

    document.body.appendChild(a);

    a.click();

    a.remove();

    URL.revokeObjectURL(url);
}

function openRaw() {
    if (!state.current) return;

    const blob =
        new Blob(
            [state.current.code],
            {
                type: 'text/plain;charset=utf-8'
            }
        );

    const url =
        URL.createObjectURL(blob);

    window.open(
        url,
        '_blank',
        'noopener,noreferrer'
    );

    setTimeout(() => {
        URL.revokeObjectURL(url);
    }, 5000);
}

function openFromUrl() {
    const match =
        location.pathname.match(
            /^\/share\/([^/]+)$/
        );

    if (!match) return;

    const id =
        decodeURIComponent(match[1]);

    if (
        state.posts.some(
            post => post.id === id
        )
    ) {
        openPost(id);
    }
}

search.addEventListener(
    'input',
    render
);

filter.addEventListener(
    'change',
    render
);

grid.addEventListener(
    'click',
    event => {
        const button =
            event.target.closest(
                '[data-open]'
            );

        if (!button) return;

        openPost(
            button.dataset.open
        );
    }
);

document
    .getElementById('closeBtn')
    .addEventListener(
        'click',
        closeViewer
    );

document
    .getElementById('copyBtn')
    .addEventListener(
        'click',
        copyCode
    );

document
    .getElementById('downloadBtn')
    .addEventListener(
        'click',
        downloadCode
    );

document
    .getElementById('rawBtn')
    .addEventListener(
        'click',
        openRaw
    );

modal.addEventListener(
    'click',
    event => {
        if (
            event.target === modal
        ) {
            closeViewer();
        }
    }
);

document.addEventListener(
    'keydown',
    event => {
        if (
            event.key === 'Escape' &&
            modal.classList.contains('active')
        ) {
            closeViewer();
        }
    }
);

loadPosts();
</script>

</body>
</html>
